<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявка отправлена — Sokolovskaya Beauty</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#2b211c" />

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png?v=1" />
  <link rel="apple-touch-icon" href="assets/favicon.png?v=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
  <style>
    .thanks {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(176, 122, 78, 0.12), transparent 60%),
        var(--bg);
    }
    .thanks__card {
      max-width: 560px;
      width: 100%;
      text-align: center;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: clamp(32px, 6vw, 56px);
      box-shadow: var(--shadow-md);
    }
    .thanks__logo { width: 86px; margin: 0 auto 22px; }
    .thanks__check {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-deep);
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
    }
    .thanks__check svg { width: 32px; height: 32px; }
    .thanks h1 {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 5.5vw, 2.7rem);
      font-weight: 600;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .thanks p { color: var(--ink-soft); font-size: 1.02rem; margin-bottom: 12px; }
    .thanks p b { color: var(--ink); }
    .thanks__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <main class="thanks">
    <div class="thanks__card">
      <img class="thanks__logo" src="assets/logo-sb-trans.png" alt="Sokolovskaya Beauty" />
      <div class="thanks__check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
      </div>
      <h1>Заявка отправлена!</h1>
      <p>Спасибо! Мы свяжемся с вами в ближайшее время и подберём лучший вариант под ваши пожелания и бюджет.</p>
      <p>Ваш подарок — <b>гайд по уходу за волосами</b> — уже скачивается. Если загрузка не началась, нажмите кнопку ниже.</p>
      <div class="thanks__actions">
        <a href="assets/hair-care-guide.pdf" download="Гайд по уходу за волосами.pdf" class="btn">Скачать гайд</a>
        <a href="index.html" class="btn btn--ghost">Вернуться на сайт</a>
      </div>
    </div>
  </main>
</body>
</html>
